services:
  geminus-admin:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: geminus-admin
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../admin:/app
      - caddy_data:/data
      - caddy_config:/config
    working_dir: /app
    command: frankenphp run --config Caddyfile
    tty: true
    depends_on:
      - db
  
  db:
    image: postgres:16
    container_name: geminus-db
    shm_size: 128mb
    environment:
      POSTGRES_DB: geminus
      POSTGRES_PASSWORD: geminus.admin
      POSTGRES_USER: geminus
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    container_name: geminus-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  caddy_data:
  caddy_config:
    